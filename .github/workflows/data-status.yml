name: Data freshness
on:
  workflow_dispatch:
  schedule:
    - cron: "25 4 * * 1"
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-data.js --remote
